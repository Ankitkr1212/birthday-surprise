</head>
<body>
<!-- Flowers outside the letter -->
<div class="flower-container">
    <div class="flower flower1">🌸</div>
    <div class="flower flower2">🌷</div>
    <div class="flower flower3">🌼</div>
    <div class="flower flower4">🌺</div>
    <div class="flower flower5">🌸</div>
    <div class="flower flower6">🌻</div>
</div>

<div class="poem4">

    <img src="../Images/Ph7.jpg" class="img7" alt="Photo 7">

    <div class="slide-in text1">
        <p>नदी, पहाड़ भी झूमे होंगे</p>
        <p>शीतल हवा भी चली होगी</p>
        <p>आपकी एक बोली से</p>
        <p>पूरी घाटी में नई जान आई होगी</p>
    </div>

    <div class="slide-in text1">
        <p>खुशियों का मौसम होगा</p>
        <p>जब फूलों की तरह तुम्हारा चेहरा खिला होगा।</p>
        <p>वो दिन भी क्या दिन होगा</p>
        <p>जिस दिन आपका जन्म हुआ होगा।</p>
    </div>

    <img src="../Images/Ph8.jpg" class="img8" alt="Photo 8">

    <button id="nextBtn" class="next-button" aria-label="Go to next page">
        →
    </button>
    <button id="backBtn" class="back-button" aria-label="Go back">
        ←
    </button>
