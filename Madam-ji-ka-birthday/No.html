<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>No page</title>
    <link rel="stylesheet" href="No.css">
</head>
<body>
<div class="flower-container" id="flowerContainer"></div>
<div class="Question-container">
    <h1> Why???. </h1>
    <h2> You're a bad girl.</h2>

    <p>Won't you say yes?👉👈</p>

    <div class="cat-container" id="catContainer">

            <svg id="cryingCat"
                 viewBox="0 0 300 300"
                 xmlns="http://www.w3.org/2000/svg">

                <g class="cat-body">

                    <!-- Tail -->
                    <path d="M205 245 C270 250 270 170 235 190"
                          fill="#fff1df" stroke="#59433e"
                          stroke-width="5" stroke-linecap="round"/>

                    <!-- Ears -->
                    <path d="M65 110 L45 22 Q40 5 65 18 L115 65 Z"
                          fill="#fff1df" stroke="#59433e"
                          stroke-width="5" stroke-linejoin="round"/>

                    <path d="M185 65 L235 18 Q260 5 255 22 L235 110 Z"
                          fill="#fff1df" stroke="#59433e"
                          stroke-width="5" stroke-linejoin="round"/>

                    <!-- Inner ears -->
                    <path d="M59 80 L51 30 L94 67 Z"
                          fill="#f5a6aa"/>

                    <path d="M206 67 L249 30 L241 80 Z"
                          fill="#f5a6aa"/>

                    <!-- Face -->
                    <ellipse cx="150" cy="125" rx="110" ry="100"
                             fill="#fff8eb"
                             stroke="#59433e" stroke-width="5"/>

                    <!-- Body -->
                    <path d="M75 210 Q55 245 70 275
                     Q150 295 230 275
                     Q245 245 225 210 Z"
                          fill="#fff1df"
                          stroke="#59433e" stroke-width="5"/>

                    <!-- Paws -->
                    <ellipse cx="112" cy="271" rx="32" ry="15"
                             fill="#fff8eb"
                             stroke="#59433e" stroke-width="4"/>

                    <ellipse cx="188" cy="271" rx="32" ry="15"
                             fill="#fff8eb"
                             stroke="#59433e" stroke-width="4"/>


                    <!-- ======================== -->
                    <!-- SAD EXPRESSION -->
                    <!-- ======================== -->

                    <g class="sad-face">

                        <!-- Sad eyebrows -->
                        <path d="M90 75 Q105 65 120 78"
                              fill="none"
                              stroke="#59433e"
                              stroke-width="5"
                              stroke-linecap="round"/>

                        <path d="M180 78 Q195 65 210 75"
                              fill="none"
                              stroke="#59433e"
                              stroke-width="5"
                              stroke-linecap="round"/>

                        <!-- Crying eyes -->
                        <ellipse cx="105" cy="115" rx="17" ry="23"
                                 fill="#493b3a"/>

                        <ellipse cx="195" cy="115" rx="17" ry="23"
                                 fill="#493b3a"/>

                        <!-- Eye highlights -->
                        <circle cx="99" cy="108" r="6" fill="white"/>
                        <circle cx="189" cy="108" r="6" fill="white"/>

                        <!-- Sad open mouth -->
                        <path d="M130 175 Q150 145 170 175
                         Q150 190 130 175 Z"
                              fill="#e88996"
                              stroke="#59433e"
                              stroke-width="4"
                              stroke-linejoin="round"/>

                    </g>


                    <!-- ======================== -->
                    <!-- HAPPY EXPRESSION -->
                    <!-- ======================== -->

                    <g class="happy-face">

                        <!-- Happy closed eyes -->
                        <path d="M85 115 Q105 140 125 115"
                              fill="none"
                              stroke="#493b3a"
                              stroke-width="5"
                              stroke-linecap="round"/>

                        <path d="M175 115 Q195 140 215 115"
                              fill="none"
                              stroke="#493b3a"
                              stroke-width="5"
                              stroke-linecap="round"/>

                        <!-- Happy smile -->
                        <path d="M130 160 Q150 185 170 160"
                              fill="none"
                              stroke="#59433e"
                              stroke-width="5"
                              stroke-linecap="round"/>

                    </g>


                    <!-- Nose (visible in both expressions) -->
                    <path d="M143 140 Q150 132 157 140 Q150 150 143 140"
                          fill="#ed91a0"/>

                    <!-- Blush -->
                    <ellipse cx="73" cy="155" rx="17" ry="9"
                             fill="#f4a6a6" opacity=".5"/>

                    <ellipse cx="227" cy="155" rx="17" ry="9"
                             fill="#f4a6a6" opacity=".5"/>

                    <!-- Whiskers -->
                    <g stroke="#59433e"
                       stroke-width="2.5"
                       stroke-linecap="round">

                        <path d="M55 145 L20 135 M55 155 L18 160"/>
                        <path d="M245 145 L280 135 M245 155 L282 160"/>

                    </g>

                </g>


                <!-- ======================== -->
                <!-- ANIMATED TEARS -->
                <!-- ======================== -->

                <g class="tears">

                    <path class="tear tear-one"
                          d="M95 140 Q85 158 95 170 Q105 158 95 140"
                          fill="#65c9f5"/>

                    <path class="tear tear-two"
                          d="M205 140 Q195 158 205 170 Q215 158 205 140"
                          fill="#65c9f5"/>

                    <path class="tear tear-three"
                          d="M95 140 Q85 158 95 170 Q105 158 95 140"
                          fill="#65c9f5"/>

                    <path class="tear tear-four"
                          d="M205 140 Q195 158 205 170 Q215 158 205 140"
                          fill="#65c9f5"/>

                </g>

            </svg>




        <p class="cat-message">Please don't say no... 😿</p>

    </div>


    <div class="button">
        <button id="yesBtn">Yes</button>
        <button id="noBtn">No</button>
    </div>

    <h3 id="message"></h3>
    <script src="No.js"></script>
</div>

</body>
</html>
