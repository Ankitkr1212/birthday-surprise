<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yes-No Question</title>
    <link rel="stylesheet" href="question.css">
</head>
<body>

<div class="Q1">

    <h1>Today is a Very Special Day!!!</h1>




    <div class="happy-cat">

        <svg viewBox="0 0 220 200" class="cat-svg">

            <!-- Cat body -->
            <ellipse cx="110" cy="165" rx="53" ry="29"
                     fill="#f4d7bd"/>

            <!-- Paws -->
            <ellipse cx="78" cy="179" rx="20" ry="10"
                     fill="#fff0df"/>
            <ellipse cx="142" cy="179" rx="20" ry="10"
                     fill="#fff0df"/>

            <!-- Head group -->
            <g class="cat-head">

                <!-- Ears -->
                <path d="M55 75 L48 20 Q47 10 60 22 L88 53 Z"
                      fill="#f4d7bd"
                      stroke="#bd927d" stroke-width="2"/>

                <path d="M165 75 L172 20 Q173 10 160 22 L132 53 Z"
                      fill="#f4d7bd"
                      stroke="#bd927d" stroke-width="2"/>

                <!-- Inner ears -->
                <path d="M58 54 L56 29 L76 52 Z"
                      fill="#e9a4b2"/>

                <path d="M162 54 L164 29 L144 52 Z"
                      fill="#e9a4b2"/>

                <!-- Face -->
                <ellipse cx="110" cy="95" rx="64" ry="57"
                         fill="#fff0df"
                         stroke="#bd927d"
                         stroke-width="2"/>

                <!-- Happy eyes -->
                <path d="M77 91 Q86 102 95 91"
                      fill="none"
                      stroke="#704d45"
                      stroke-width="3"
                      stroke-linecap="round"/>

                <path d="M125 91 Q134 102 143 91"
                      fill="none"
                      stroke="#704d45"
                      stroke-width="3"
                      stroke-linecap="round"/>

                <!-- Rosy cheeks -->
                <ellipse cx="70" cy="111" rx="12" ry="7"
                         fill="#f4a8b9" opacity="0.7"/>

                <ellipse cx="150" cy="111" rx="12" ry="7"
                         fill="#f4a8b9" opacity="0.7"/>

                <!-- Nose -->
                <path d="M105 105 Q110 100 115 105 Q110 113 105 105"
                      fill="#dc8799"/>

                <!-- Smile -->
                <path d="M110 112 Q98 128 88 116
                     M110 112 Q122 128 132 116"
                      fill="none"
                      stroke="#704d45"
                      stroke-width="2.5"
                      stroke-linecap="round"/>

                <!-- Whiskers -->
                <path d="M65 103 L39 97 M65 112 L38 115
                     M155 103 L181 97 M155 112 L182 115"
                      stroke="#bd927d"
                      stroke-width="1.5"
                      stroke-linecap="round"
                      fill="none"/>

            </g>

        </svg>

        <div class="cat-heart">♡</div>

    </div>
    <h1>Will You Accept My Gift?</h1>

    <div class="button-container">

        <button id="yesBtn">YES ♡</button>
        <button id="noBtn">NO ♡</button>
    </div>
</div>

<script src="question.js"></script>

</body>
</html>
