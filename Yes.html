<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Yes page</title>
    <link rel="stylesheet" href="Yes.css">
</head>
<body>

<div class="page">

    <!-- Flowers outside the letter -->
    <div class="flower flower1">🌸</div>
    <div class="flower flower2">🌷</div>
    <div class="flower flower3">🌼</div>
    <div class="flower flower4">🌺</div>
    <div class="flower flower5">🌸</div>
    <div class="flower flower6">🌷</div>

    <!-- Letter -->
    <div class="letter">

        <div class="message">
            <h2>You said YES!!!</h2>

            <p>
                One Gift was not enough. So, for you, there are three!
                I hope each one brings a smile to your face.
            </p>
        </div>

        <!-- Your three existing buttons -->
        <div class="button-container">
            <button id="gift1">Gift 1</button>
            <button id="gift2">Gift 2</button>
            <button id="gift3">Gift 3</button>
        </div>

    </div>

</div>
<script src="Yes.js"></script>


</body>
</html>
